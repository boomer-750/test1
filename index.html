<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1113">
<title>Тренировка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1113; --card:#171A1E; --card2:#1F2329; --line:#2A2F36; --line2:#3A414A;
  --text:#F2F4F5; --soft:#D5DADF; --mute:#9AA3AC; --acc:#C6F24E; --acc2:#7E9B2A; --accbg:rgba(198,242,78,.10);
  --warn:#F5B94A; --warnbg:rgba(245,185,74,.10); --bad:#FF7A6B;
  --navh:68px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;color-scheme:dark;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--acc);z-index:20;transition:width .3s ease,opacity .3s}
#bar.on{width:70%;opacity:1}#bar.off{width:100%;opacity:0}
.screen{flex:1;padding:16px 16px calc(var(--navh) + var(--safe-b) + 24px);display:flex;flex-direction:column}
.screen.inner{padding-bottom:calc(var(--safe-b) + 24px)}
h1{margin:0;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
h2{margin:0;font-size:15px;font-weight:800}
.sub{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.45}
.row{display:flex;align-items:center}
.gap8{gap:8px}.gap10{gap:10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:10px}
.card.acc{background:var(--accbg);border:1px solid rgba(198,242,78,.35)}
.card.warn{background:var(--warnbg);border:1px solid rgba(245,185,74,.35)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--acc);color:var(--acc);font-size:12px;font-weight:700;white-space:nowrap;background:none}
.pill.mute{border-color:transparent;background:var(--card2);color:var(--mute)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.bars{display:flex;gap:6px;margin-top:10px}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.bars i.d{background:var(--acc2)} .bars i.c{background:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.item{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px;background:var(--card);border:0;border-radius:14px;text-align:left;width:100%}
.item:active{background:var(--card2)}
.num{width:30px;height:30px;border-radius:10px;background:var(--card2);color:var(--mute);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.num.on{background:var(--acc);color:#0F1113}
.item .t{font-size:14px;font-weight:700;line-height:1.25}
.item .s{margin-top:3px;font-size:12px;color:var(--mute)}
.item .r{text-align:right;flex:none}
.item .r b{font-size:14px;display:block} .item .r span{display:block;margin-top:2px;font-size:11px;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:0;border-radius:16px;background:var(--acc);color:#0F1113;font-size:16px;font-weight:800}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.4}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--text);height:48px;font-size:15px;font-weight:700;border-radius:14px}
.btn.small{height:46px;font-size:14px;border-radius:12px;width:auto;padding:0 16px;flex:none}
.ghost{background:none;border:0;color:var(--mute);font-size:13px;font-weight:700;padding:12px 4px;min-height:44px}
.ghost:disabled{opacity:.4}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(15,17,19,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav div{max-width:480px;margin:0 auto;height:var(--navh);display:flex;justify-content:space-around;align-items:center;padding:0 8px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:11px;font-weight:700;min-width:64px;min-height:48px;justify-content:center}
.nav button.on{color:var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;height:44px;margin:-4px -10px 0}
.top .mid{font-size:13px;font-weight:700;color:var(--mute)}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--text);border-radius:12px}
.set{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;background:var(--card);border-radius:12px;font-size:14px;font-weight:700}
.set .v{margin-left:auto;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.set.todo{background:none;border:1px dashed var(--line2);color:var(--mute)}
.tick{width:22px;height:22px;border-radius:11px;background:var(--acc);color:#0F1113;display:flex;align-items:center;justify-content:center;flex:none}
.circ{width:22px;height:22px;border-radius:11px;border:2px solid var(--line2);flex:none}
.now{padding:14px;background:var(--card2);border:1px solid var(--acc);border-radius:16px;scroll-margin:120px}
.now .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.now .h b{font-size:14px;font-weight:800;color:var(--acc)} .now .h span{font-size:12px;color:var(--mute);text-align:right}
.steps{display:flex;gap:12px;margin-top:12px}
.steps>div{flex:1;min-width:0}
.steps label,.sl{font-size:12px;color:var(--mute);display:block}
.stp{margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.stp button{width:44px;height:48px;border:0;border-radius:12px;background:var(--line);font-size:22px;font-weight:700;line-height:1;flex:none;touch-action:manipulation}
.stp button:active{background:var(--line2)}
.stp input{width:100%;min-width:0;text-align:center;background:none;border:0;font-size:26px;font-weight:800;padding:0;font-variant-numeric:tabular-nums}
.stp input::placeholder{color:var(--line2)}
.field{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px}
.field::placeholder{color:var(--mute)}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.toast{margin-top:12px;padding:12px 14px;background:var(--card2);border-radius:14px;font-size:13px;line-height:1.45;color:var(--soft)}
.toast.err{color:var(--bad)}
.toast.ok{color:var(--acc)}
#toasts{position:fixed;left:0;right:0;top:12px;z-index:30;display:flex;flex-direction:column;align-items:center;pointer-events:none;padding:0 16px}
#toasts .toast{pointer-events:auto;max-width:448px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid var(--line2);margin-top:8px;animation:drop .2s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;margin-top:8px}
.opt.on{border-color:var(--acc);background:var(--card2)}
.opt b{display:block;font-size:16px;font-weight:800} .opt small{display:block;margin-top:2px;font-size:12px;color:var(--mute)}
.opt em{font-style:normal;font-size:13px;font-weight:800;color:var(--mute)} .opt.on em{color:var(--acc)}
.seg{display:flex;gap:6px;margin-top:14px;background:var(--card);padding:4px;border-radius:14px}
.seg button{flex:1;height:38px;border:0;border-radius:10px;background:none;color:var(--mute);font-size:13px;font-weight:700}
.seg button.on{background:var(--acc);color:#0F1113;font-weight:800}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.good{color:var(--acc);font-size:13px;font-weight:700}
.vol{display:flex;align-items:center;gap:10px;margin-top:12px}
.vol span{font-size:13px;font-weight:700}.vol .n{width:72px;flex:none}.vol .c{width:44px;text-align:right;font-weight:800;flex:none;font-size:12px;color:var(--soft)}
.vol .tr{flex:1;height:10px;border-radius:5px;background:var(--card2);position:relative}
.vol .tr i{position:absolute;left:0;top:0;height:10px;border-radius:5px;background:var(--acc)}
.vol .tr u{position:absolute;top:-3px;width:2px;height:16px;background:var(--soft);border-radius:1px}
.dot{width:10px;height:10px;border-radius:5px;background:var(--warn);margin-top:5px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:16px;flex:1}
.me{align-self:flex-end;max-width:85%;background:var(--card2);padding:12px 14px;border-radius:16px 16px 4px 16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.ai{align-self:flex-start;max-width:92%;background:var(--card);padding:12px 14px;border-radius:16px 16px 16px 4px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.ai.err{color:var(--bad)}
.typing span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:3px;background:var(--mute);animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.sug{background:var(--card2);border:0;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--soft);text-align:left}
.dock{position:sticky;bottom:calc(var(--navh) + var(--safe-b));background:linear-gradient(transparent,var(--bg) 14px);padding:18px 0 8px;margin-top:auto;z-index:3}
.inner .dock{bottom:0;padding-bottom:calc(8px + var(--safe-b));margin-bottom:calc(-24px - var(--safe-b))}
.step-n{width:20px;height:20px;border-radius:10px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;margin-top:1px}
.ol{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ol div{display:flex;gap:10px;font-size:13px;line-height:1.5;color:var(--soft)}
.bul{display:flex;gap:8px;margin-top:8px;font-size:13px;line-height:1.45;color:var(--soft)}
.bul::before{content:'';width:5px;height:5px;border-radius:3px;margin-top:7px;flex:none;background:currentColor;opacity:.6}
.bul.a::before{background:var(--acc);opacity:1}.bul.w::before{background:var(--warn);opacity:1}
.video{height:140px;border-radius:16px;background:radial-gradient(120% 120% at 30% 20%,#262B32,#171A1E);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--soft);font-size:13px;font-weight:700;border:0;width:100%}
.video i{width:56px;height:56px;border-radius:28px;background:var(--acc);color:#0F1113;display:flex;align-items:center;justify-content:center}
.hist-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:0;min-height:44px}
.hist-x{margin-top:10px;display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--soft);border-top:1px solid var(--line);padding-top:12px}
.hist-x b{display:block;font-weight:700;color:var(--text);margin-bottom:3px}
.chev{transition:transform .2s;color:var(--mute)}
.open .chev{transform:rotate(180deg)}
.muted{color:var(--mute)}
.center{text-align:center;color:var(--mute);margin:auto;padding:40px 0;font-size:14px;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.stats>div{background:var(--card);border-radius:14px;padding:12px 14px;text-align:left}
.stats b{display:block;font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.timer{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--card2);margin-bottom:8px;border:1px solid var(--line2)}
.timer.end{border-color:var(--acc)}
.timer .tt{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:62px}
.timer .tl{flex:1;font-size:12px;color:var(--mute);line-height:1.35}
.timer .pr{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.timer .pr i{display:block;height:3px;background:var(--acc);transition:width 1s linear}
.skel{background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--safe-b));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 8px}
textarea.field{height:auto;padding:12px 14px;line-height:1.45;resize:vertical}
.fl{display:block;margin-top:14px}.fl>span{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}.fl small{display:block;font-size:12px;color:var(--mute);margin-top:6px}
.form .steps,.form>div{margin-top:14px}
.switch{display:flex;gap:12px;align-items:flex-start;margin-top:14px;cursor:pointer}.switch input{width:22px;height:22px;accent-color:#C6F24E;margin:2px 0 0;flex:none}.switch b{display:block;font-size:14px}.switch small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.picklist{margin-top:10px}.grp{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.pick{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:10px 12px;border:0;border-radius:12px;background:var(--card2);text-align:left;font-size:14px;font-weight:700;margin-top:6px}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.lnk{display:block;background:none;border:0;padding:2px 0;text-align:left;font-size:13px;font-weight:700;color:var(--text);width:100%}
.lnk.sm{font-size:12px;font-weight:600;color:var(--acc)}
.icon.sm{width:36px;height:40px}.icon:disabled{opacity:.25}
.notecard{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;color:var(--soft);font-size:13px;line-height:1.45}
.set .pen{margin-left:8px;color:var(--mute);display:inline-flex;vertical-align:middle}
button.set{width:100%;border:0;text-align:left;color:var(--text)}
.tgt{flex:1;background:none;border:0;text-align:left;color:var(--text);padding:0;display:block}
.tgt svg{color:var(--mute);margin-left:4px}
.sb{background:var(--card2);border:0;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.sb.wu{color:var(--mute);background:transparent;border:1px solid var(--line)}
.map{display:flex;gap:6px;justify-content:center}.map>div{display:flex;flex-direction:column;align-items:center;gap:2px}.map svg{width:76px;height:144px}.map span{font-size:10px;color:var(--mute)}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);margin-top:4px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat{display:flex;gap:3px;margin-top:12px;justify-content:space-between}.hc{display:flex;flex-direction:column;gap:3px;flex:1}.hc i{display:block;aspect-ratio:1;border-radius:2px;background:var(--card2)}.hc i.on{background:var(--acc)}.hc i.fut{opacity:.3}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.yt .video{height:100%}
.toast.pr{color:#0F1113;background:var(--acc);border-color:var(--acc)!important;font-weight:800}
@media (prefers-reduced-motion:no-preference){.screen.anim{animation:in .16s ease-out}@keyframes in{from{opacity:.5;transform:translateY(4px)}}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="toasts" aria-live="assertive"></div>
<div id="app" aria-live="polite"></div>
<script>
'use strict';
// ====== Настройка: адрес вебхука n8n (workflow fit-api, путь /fit-api) ======
const DEFAULT_API = 'https://webpowerai.ru/webhook/fit-api';
// ===========================================================================
const tg = window.Telegram && window.Telegram.WebApp;
const initData = (tg && tg.initData) || '';
const QS = new URLSearchParams(location.search);
// Подмену адреса разрешаем только вне Telegram (для проверки страницы).
const API = (!initData && QS.get('api')) || DEFAULT_API;
const safe = (fn) => { try { return fn(); } catch (e) { return undefined; } };
if (tg) {
  safe(() => tg.ready()); safe(() => tg.expand());
  safe(() => tg.setHeaderColor('#0F1113')); safe(() => tg.setBackgroundColor('#0F1113')); safe(() => tg.setBottomBarColor && tg.setBottomBarColor('#0F1113'));
  safe(() => tg.disableVerticalSwipes && tg.disableVerticalSwipes());
}

// Встроенные описания упражнений: показываются, если в базе поле пустое.
const EXINFO = {"Жим в кроссовере под углом 30 градусов":{"equipment":"кроссовер, наклонная скамья ~30°","secondary":["delts","triceps"],"description":"Жим двумя руками из нижних блоков на наклонной скамье. Нагружает верх груди и даёт постоянное натяжение на всём пути.","setup":"Скамья между стойками под углом около 30°. Рукоятки на нижних блоках, высота так, чтобы взять их из положения лёжа без рывка.","technique":"Сядьте, возьмите рукоятки, лягте и сведите лопатки вниз и друг к другу.\nВыжимайте рукоятки вверх и чуть вперёд, по дуге к точке над верхом груди.\nВверху не блокируйте локти до конца, держите напряжение в груди.\nВозвращайтесь за 2–3 секунды до растяжения груди, без броска веса.","cues":["Лопатки держите сведёнными и опущенными всё упражнение.","Выдох на усилии, вдох на возврате.","В дропсете вес сбрасывайте сразу, без отдыха.","Если плечо «щёлкает», опустите угол скамьи до 15–20°."],"mistakes":["Слишком тяжёлый вес: плечи уходят вперёд, грудь не работает.","Рывок корпусом или отрыв таза от скамьи.","Короткая амплитуда: нет растяжения внизу."],"target":"Верх груди, ближе к ключицам. Плечи почти не устают.","video_url":"https://www.youtube.com/results?search_query=%D0%B6%D0%B8%D0%BC%20%D0%B2%20%D0%BA%D1%80%D0%BE%D1%81%D1%81%D0%BE%D0%B2%D0%B5%D1%80%D0%B5%20%D0%BD%D0%B0%20%D0%BD%D0%B0%D0%BA%D0%BB%D0%BE%D0%BD%D0%BD%D0%BE%D0%B9%20%D1%81%D0%BA%D0%B0%D0%BC%D1%8C%D0%B5%20%D1%82%D0%B5%D1%85%D0%BD%D0%B8%D0%BA%D0%B0"},"Тяга с верхнего блока":{"equipment":"верхний блок, одиночная рукоятка","secondary":["biceps"],"description":"Тяга верхнего блока одной рукой (КРО): каждая сторона работает отдельно, это выравнивает силу и позволяет лучше чувствовать широчайшую.","setup":"Сядьте боком или лицом к блоку, зафиксируйте бёдра под валиками. Рукоятка с одной стороны, свободной рукой держитесь за стойку.","technique":"Выпрямите руку вверх, слегка наклонив корпус назад и потянувшись плечом.\nТяните локоть вниз и к бедру, сводя лопатку к позвоночнику.\nВ нижней точке задержитесь на секунду и сожмите широчайшую.\nМедленно вернитесь в растяжение, затем делайте вторую сторону.","cues":["Думайте о том, чтобы вести локоть, а не тянуть кистью.","Сначала левая сторона, потом правая, подходы идут парами.","Под конец подхода потянитесь плечом вверх: растяжение широчайшей даёт больше роста.","Лямки помогают, если хват устаёт раньше спины."],"mistakes":["Тяга бицепсом: рука сгибается раньше, чем двигается локоть.","Раскачка корпусом.","Неполное растяжение вверху."],"target":"Широчайшая сбоку под подмышкой, не бицепс.","video_url":"https://www.youtube.com/results?search_query=%D1%82%D1%8F%D0%B3%D0%B0%20%D0%B2%D0%B5%D1%80%D1%85%D0%BD%D0%B5%D0%B3%D0%BE%20%D0%B1%D0%BB%D0%BE%D0%BA%D0%B0%20%D0%BE%D0%B4%D0%BD%D0%BE%D0%B9%20%D1%80%D1%83%D0%BA%D0%BE%D0%B9%20%D1%82%D0%B5%D1%85%D0%BD%D0%B8%D0%BA%D0%B0"},"Отжимания на брусьях":{"equipment":"брусья (с отягощением по необходимости)","secondary":["triceps","delts"],"description":"Отжимания на брусьях с наклоном корпуса вперёд: нагрузка уходит в нижнюю часть груди и трицепс.","setup":"Возьмитесь за брусья, поднимитесь на прямых руках. Для утяжеления используйте пояс с блином. Корпус слегка наклонён вперёд, ноги скрещены сзади.","technique":"Из верхней точки опускайтесь, разводя локти чуть в стороны.\nОпускайтесь, пока плечо не сравняется с локтем, или чуть ниже, если плечи здоровы.\nВыжимайте себя вверх, держа корпус наклонённым.\nВверху не блокируйте локти полностью.","cues":["Чем больше наклон вперёд, тем больше грудь; вертикальный корпус смещает нагрузку на трицепс.","Контролируемый спуск 2–3 секунды.","Когда 10 повторений даются легко, добавьте вес на поясе: шаг 2,5 кг.","Не опускайтесь ниже, чем позволяет плечо: обычно до угла 90° в локте."],"mistakes":["Слишком глубокий провал, когда плечи тянет вперёд и вверх.","Раскачка ногами.","Плечи подняты к ушам."],"target":"Низ груди и трицепс. Боль спереди в плече — сигнал уменьшить глубину.","video_url":"https://www.youtube.com/results?search_query=%D0%BE%D1%82%D0 function restFor(cur, tech) {      // сколько отдыхать перед следующим подходом
  if (!cur) return 0;
  if (cur.side === 'right') return 0;                // вторая сторона КРО — сразу
  switch (cur.kind) {
    case 'drop': return 0;
    case 'rest_pause': return 15;
    case 'warmup': return 45;
    case 'lead': return 60;
    case 'pyramid_step': return tech === 'reverse_pyramid' ? 60 : 105;
    default: return 120;
  }
}
let restTick = null;
function startRest(sec, label) {
  clearInterval(restTick);
  if (!sec) { S.rest = null; return; }
  S.rest = { until: Date.now() + sec * 1000, total: sec, label, ended: false };
  restTick = setInterval(updateRest, 500);
}
function stopRest() { clearInterval(restTick); S.rest = null; const el = document.getElementById('timer'); if (el) el.remove(); }
function updateRest() {
  const r = S.rest; const el = document.getElementById('timer');
  if (!r) { clearInterval(restTick); return; }
  const left = Math.max(0, Math.ceil((r.until - Date.now()) / 1000));
  if (left === 0 && !r.ended) { r.ended = true; haptic('success'); safe(() => navigator.vibrate && navigator.vibrate([200, 100, 200])); }
  if (!el) return;
  el.classList.toggle('end', left === 0);
  el.querySelector('.tt').textContent = left ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : 'Пора';
  el.querySelector('.pr i').style.width = `${(1 - left / r.total) * 100}%`;
  if (left === 0 && Date.now() - r.until > 60000) stopRest();
}

}

function chart(points, label, unit = 'кг') {
  const W = 326, H = 120, P = 10;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', '100%'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', label); svg.style.display = 'block'; svg.style.overflow = 'visible';
  const ys = points.map((p) => p.y); let lo = Math.min(...ys), hi = Math.max(...ys); if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
  const X = (i) => P + (points.length === 1 ? (W - 2 * P) / 2 : (i * (W - 2 * P)) / (points.length - 1));
  const Y = (v) => H - 18 - ((v - lo) / (hi - lo)) * (H - 36);
  const add = (t, a, txt) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.append(e); return e; };
  [0.25, 0.5, 0.75].forEach((f) => { const y = 18 + f * (H - 36); add('line', { x1: 0, x2: W, y1: y, y2: y, stroke: '#2A2F36', 'stroke-width': 1 }); });
  const d = points.map((p, i) => `${X(i)},${Y(p.y)}`).join(' ');
  add('polygon', { points: `${X(0)},${H - 18} ${d} ${X(points.length - 1)},${H - 18}`, fill: 'rgba(198,242,78,.08)' });
  add('polyline', { points: d, fill: 'none', stroke: '#C6F24E', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  points.forEach((p, i) => { const last = i === points.length - 1; const c = add('circle', last ? { cx: X(i), cy: Y(p.y), r: 6, fill: '#0F1113', stroke: '#C6F24E', 'stroke-width': 2.5 } : { cx: X(i), cy: Y(p.y), r: 3.5, fill: '#C6F24E' });
    add('title', {}, `${dshort(p.x)}: ${fmt(p.y)} ${unit}`); c.append(svg.lastChild); });
  const mx = points.reduce((m, p, i) => (p.y > points[m].y ? i : m), 0);
  add('text', { x: Math.min(W - 4, Math.max(4, X(mx))), y: Y(points[mx].y) - 10, fill: '#9AA3AC', 'font-size': 11, 'text-anchor': 'middle', 'font-family': 'Manrope' }, fmt(points[mx].y));
  return svg;
}

  const sug = ['Почему встал жим в кроссовере?', 'Где у меня застой?', 'Что улучшить на этой неделе?', 'Хватает ли мне объёма на спину?'];

    : h('div', {}, h('div', { class: 'sub' }, 'Например:'), h('div', { class: 'chips' }, sug.map((t) => h('button', { class: 'sug', onclick: () => send(t) }, t)))));

    catch (e) { S.chat.pop(); S.chat.push({ text: e.message, err: true }); }

  }
  return h('div', { class: 'screen' },
    h('div', { class: 'row' }, h('h1', { style: 'font-size:24px;flex:1' }, 'ИИ-тренер'), S.chat.length ? h('button', { class: 'icon', 'aria-label': 'Очистить чат', onclick: () => confirmBox('Очистить переписку?', () => { S.chat = []; ls.set('fit.chat', []); render(); }) }, icon('trash', 20)) : null),

function nowCard(c, ex, lastDone, prevSet) {

  const ok = h('button', { class: 'btn', style: 'margin-top:14px;height:52px;border-radius:14px', onclick: async () => {
    const weight = W.get(), reps = R.get();
    if (!Number.isFinite(weight) || weight < 0 || weight > 500) return toast('Укажите вес в килограммах (0 — свой вес)', 'err');
    if (!Number.isInteger(reps) || reps < 1 || reps > 100) return toast('Повторения: целое число от 1 до 100', 'err');
    await saveSet(weight, reps, ok);
  } }, icon('check', 20, 2.6), 'Подход выполнен');
  return h('div', { class: 'now', id: 'now' },
    h('div', { class: 'h' }, h('b', {}, `${c.label}${SIDE[c.side]}`), h('span', {}, c.hint || '')),
    prevSet ? h('div', { class: 'sub', style: 'margin-top:4px;font-size:12px' }, `В прошлый раз этот подход: ${fmt(prevSet.weight)} кг × ${prevSet.reps}`) : null,
    h('div', { class: 'steps' }, W.el, R.el), ok);
}
